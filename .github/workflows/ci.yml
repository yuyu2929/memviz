name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  cxx: g++,     cc: gcc }
          - { name: linux-clang, os: ubuntu-latest,  cxx: clang++, cc: clang }
          - { name: macos-clang, os: macos-latest,   cxx: clang++, cc: clang }
          - { name: windows-msvc, os: windows-latest, cxx: '',     cc: '' }
    steps:
      - uses: actions/checkout@v4

      - name: configure (unix)
        if: runner.os != 'Windows'
        env:
          CXX: ${{ matrix.cxx }}
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build (unix)
        if: runner.os != 'Windows'
        run: cmake --build build -j 4

      - name: test (unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: configure (windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: build (windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: test (windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: warnings are errors on the test target (unix, gcc/clang)
        if: runner.os != 'Windows'
        env:
          CXX: ${{ matrix.cxx }}
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build-w -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-w -j 4

  sanitizers:
    name: sanitizers (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: ['address,undefined', 'thread']
    env:
      CXX: g++
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: build with -fsanitize=${{ matrix.san }}
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer -g"
          cmake --build build-san -j 4
      - name: run
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build-san/memviz_tests

  consumer:
    name: installed package is consumable
    runs-on: ubuntu-latest
    env:
      CXX: g++
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/prefix" -DMEMVIZ_BUILD_TESTS=OFF
          cmake --build build -j 4
          cmake --install build
      - name: find_package(memviz CONFIG) from an external project
        run: |
          mkdir -p consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.14)
          project(consumer LANGUAGES CXX)
          find_package(memviz 1 CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE memviz::memviz)
          EOF
          cat > main.cpp <<'EOF'
          #include <memviz/memviz.hpp>
          struct Silent : memviz::Backend { void frame(const memviz::Snapshot&) override {} };
          int main() {
              Silent s;
              memviz::Visualizer viz(&s, false);
              auto a = viz.array1d<int>("a", 4);
              a.set(0, 7);
              return a.get(0) == 7 ? 0 : 1;
          }
          EOF
          cmake -S . -B b -DCMAKE_PREFIX_PATH="$PWD/../prefix"
          cmake --build b
          ./b/app

  header-hygiene:
    name: header compiles standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: single TU, no other includes
        run: |
          printf '#include <memviz/memviz.hpp>\nint main(){ memviz::Visualizer v; return 0; }\n' > single.cpp
          g++ -std=c++17 -pthread -Iinclude -fsyntax-only single.cpp
          g++ -std=c++17 -pthread -Iinclude -DMEMVIZ_NO_WIN32_CONSOLE -fsyntax-only single.cpp
          clang++ -std=c++17 -pthread -Iinclude -fsyntax-only single.cpp
      - name: no stray files tracked
        run: |
          if git ls-files | grep -Eq '\.(o|obj|exe|bin)$|build/'; then
            echo "build artifacts are tracked"; exit 1
          fi
          echo clean
